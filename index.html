<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Botão do Beleza</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
      135deg,
      #e40303,
      #ff8c00,
      #ffed00,
      #008026,
      #004dff,
      #750787
    );
    color: white;
    text-align: center;
  }

  .card {
    background: rgba(255, 255, 255, 0.15);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  h1 {
    margin-top: 0;
  }

  button {
    font-size: 22px;
    padding: 15px 25px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    margin: 8px;
  }

  button:active {
    transform: scale(1.1);
  }

  .curtir {
    background: white;
    color: #750787;
    font-weight: bold;
  }

  .reiniciar {
    background: #222;
    color: white;
    font-weight: bold;
  }

  .contador {
    font-size: 48px;
    margin-top: 20px;
    transition: 0.3s;
    font-weight: bold;
  }

  .pop {
    transform: scale(1.3);
    color: #ffed00;
  }
</style>
</head>

<body>

<div class="card">
  <h1>🌈 Botão do Beleza 🌈</h1>

  <button class="curtir" onclick="curtir()">
    Gostei 👍
  </button>

  <button class="reiniciar" onclick="reiniciar()">
    Reiniciar 🔄
  </button>

  <div class="contador" id="contador">0</div>
</div>

<script>
  let total = parseInt(localStorage.getItem("curtidas")) || 0;
  const contador = document.getElementById("contador");

  contador.innerText = total;

  function curtir() {
    total++;
    localStorage.setItem("curtidas", total);

    contador.innerText = total;

    contador.classList.add("pop");
    setTimeout(() => {
      contador.classList.remove("pop");
    }, 200);
  }

  function reiniciar() {
    if (confirm("Deseja realmente zerar as curtidas?")) {
      total = 0;
      localStorage.setItem("curtidas", total);
      contador.innerText = total;
    }
  }
</script>

</body>
</html>
